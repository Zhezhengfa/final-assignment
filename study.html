<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室查询 - 校园公共信息与数据展示中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- ECharts -->
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white sticky-top">
    <div class="container">
      <a class="navbar-brand text-primary" href="index.html">校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="study.html">自习室查询</a></li>
          <li class="nav-item"><a class="nav-link" href="canteen.html">食堂信息</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-end flex-wrap mb-3">
      <div>
        <h2 class="page-title mb-1">自习室查询</h2>
        <p class="text-muted mb-0" id="updateTime">数据加载中...</p>
      </div>
    </div>
    <div class="card filter-card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-3">
            <label class="form-label">楼栋</label>
            <select class="form-select" id="buildingSelect">
              <option value="">全部楼栋</option>
            </select>
          </div>
          <div class="col-12 col-md-3">
            <label class="form-label">座位状态</label>
            <select class="form-select" id="statusSelect">
              <option value="">全部状态</option>
              <option value="空闲">空闲</option>
              <option value="紧张">紧张</option>
              <option value="满员">满员</option>
            </select>
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label">关键词搜索</label>
            <input type="text" class="form-control" id="keywordInput"
                   placeholder="输入自习室 / 楼栋 / 楼层关键词">
          </div>
          <div class="col-12 col-md-2">
            <button class="btn btn-outline-secondary w-100" id="resetBtn">重置条件</button>
          </div>
        </div>
      </div>
    </div>
    <p class="text-muted" id="resultCount">正在查询...</p>
    <div id="listState"></div>
    <div class="row g-3" id="roomList"></div>
    <div class="row g-4 mt-1">
      <div class="col-12 col-lg-7">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">各自习室座位使用情况</h5>
            <div class="chart-box mt-2" id="barChart"></div>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-5">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <h5 class="card-title">各楼栋座位总量占比</h5>
            <div class="chart-box mt-2" id="pieChart"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="container">
      © <span id="year"></span> 校园公共信息与数据展示中心 | 前端课程作业
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
